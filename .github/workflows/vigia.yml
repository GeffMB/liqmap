name: Vigia de alertas 24h

on:
  schedule:
    - cron: "*/5 * * * *"   # a cada 5 min (o GitHub pode atrasar alguns minutos em horários de pico)
  workflow_dispatch:          # botão "Run workflow" para testar na hora

permissions:
  contents: read

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Conferir alertas e avisar o celular
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python3 vigia.py
