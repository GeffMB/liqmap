name: Diagnóstico da sincronização

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Ler a nuvem (só contagens)
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python3 diag_sync.py
