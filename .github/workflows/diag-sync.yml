name: Diagnóstico da sincronização

on:
  workflow_dispatch:
    inputs:
      historico:
        description: "Ler também o histórico de desenhos (demora ~10 min)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Ler a nuvem (só contagens)
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python3 diag_sync.py && if [ "${{ inputs.historico }}" = "true" ]; then python3 diag_hist.py; fi
