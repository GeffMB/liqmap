name: Atualizar fluxos (CEX, ETFs, stablecoins)

on:
  schedule:
    - cron: "41 */2 * * *"   # a cada ~2 horas
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fluxos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar dados e gerar fluxos.json
        run: python fluxos.py
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fluxos.json
          git diff --cached --quiet || git commit -m "Atualiza fluxos.json"
          git pull --rebase -q || true
          git push
