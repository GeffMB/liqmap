name: Atualizar calendário econômico

on:
  schedule:
    - cron: "23 */3 * * *"   # a cada ~3 horas
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eventos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar eventos e gerar eventos.json
        run: python eventos.py
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eventos.json
          git diff --cached --quiet || git commit -m "Atualiza eventos.json"
          git pull --rebase -q || true
          git push
